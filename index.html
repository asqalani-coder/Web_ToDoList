<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi To Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HTML -->
  <div class="card">
    <h1>To Do List</h1>
    <div class="tambah-tugas">
      <input type="text"
      placeholder="Masukkan Tugasnya..."
      id="input-user">
      <button id="btn-tambah" onclick="tambahTugas()">Tambah</button>
    </div>
    <h2>Daftar Tugas:</h2>
    <div class="card-list" id="wadah">
    </div>
  </div>
  <!-- JavaScript-->
  <script src="script.js"></script>
</body>
</html>
